<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Navigator</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1a1a1a;
  }

  .container {
    width: 100%;
    max-width: 480px;
    padding: 40px 32px;
  }

  h1 {
    font-size: 22px;
    font-weight: 600;
    text-align: center;
    margin: 0 0 8px 0;
  }

  p.subtitle {
    text-align: center;
    color: #6b6f76;
    font-size: 14px;
    margin: 0 0 32px 0;
  }

  .nav-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .nav-list a {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 16px 18px;
    text-decoration: none;
    color: #1a1a1a;
    font-size: 16px;
    font-weight: 500;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
  }

  .nav-list a:hover {
    border-color: #c7c9ce;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    transform: translateY(-1px);
  }

  .nav-list a:active {
    transform: translateY(0);
  }

  .badge {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: #eef0ff;
    color: #4b4fd9;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
  }

  .arrow {
    margin-left: auto;
    color: #9aa0a8;
    font-size: 18px;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Choose a Page</h1>
    <p class="subtitle">Select one of the variants below</p>
    <ul class="nav-list">
      <li><a href="variant1.html"><span class="badge">1</span>Variant 1<span class="arrow">&rarr;</span></a></li>
      <li><a href="variant2.html"><span class="badge">2</span>Variant 2<span class="arrow">&rarr;</span></a></li>
      <li><a href="variant3.html"><span class="badge">3</span>Variant 3<span class="arrow">&rarr;</span></a></li>
      <li><a href="variant4.html"><span class="badge">4</span>Variant 4<span class="arrow">&rarr;</span></a></li>
      <li><a href="variant5.html"><span class="badge">5</span>Variant 5<span class="arrow">&rarr;</span></a></li>
    </ul>
  </div>
</body>
</html>
